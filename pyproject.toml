[project]
name = "kyc-integrity"
version = "0.1.0"
description = "ID document forgery and face liveness detection, judged at fixed operating points like a biometric system."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Talal Zahid" }]
requires-python = ">=3.12.11,!=3.13.0,!=3.13.1,!=3.13.2,!=3.13.3,<3.14"
dependencies = [
    "httpx==0.28.1",
]

[project.scripts]
kyc = "kyc.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
